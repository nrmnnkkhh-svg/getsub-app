name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned SDK packages (platform-33, build-tools 33.0.2)
        run: |
          mkdir -p ci-artifacts
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-33" "build-tools;33.0.2" > /dev/null
          echo "$ANDROID_HOME/build-tools/33.0.2" >> "$GITHUB_PATH"
          echo "GETSUB_ANDROID_JAR=$ANDROID_HOME/platforms/android-33/android.jar" >> "$GITHUB_ENV"

      - name: Prepare signing key (repo secret if present, else ephemeral)
        env:
          KS_B64: ${{ secrets.GETSUB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sign.keystore"
            echo "Signing with the repo-secret keystore: CI APKs upgrade-install seamlessly"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/sign.keystore" -alias debug \
              -storepass android -keypass android -dname "CN=GetSub-CI" \
              -keyalg RSA -keysize 2048 -validity 7 > /dev/null
            echo "No GETSUB_KEYSTORE_B64 secret set: using EPHEMERAL key (install requires uninstall first)"
          fi
          echo "GETSUB_KEYSTORE=$RUNNER_TEMP/sign.keystore" >> "$GITHUB_ENV"

      - name: Build APK with the project's own build.sh (d8 branch, version-stamped)
        env:
          GETSUB_VERSION_NAME: ci-${{ github.run_number }}
          GETSUB_VERSION_CODE: ${{ github.run_number }}
        run: |
          bash build.sh
          cp build/apk/app.apk ci-artifacts/getsub-app-ci.apk

      - name: Parser suite (40 checks) + golden diff vs the Python CLI formatter
        run: bash ci/run_parser_tests.sh

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator UI tests (real Android 13, adb-driven)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          ram-size: 2048M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash ci/emulator_ui_test.sh

      - name: Upload artifacts (APK, screenshots, reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: getsub-ci-artifacts
          path: ci-artifacts/
          if-no-files-found: warn
